<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphite Engine | CodeAlpaca</title>
    <style>
        :root {
            --bg: #0f111a;
            --surface: #1a1d2d;
            --primary: #00e6a8;
            --text: #e0e6ed;
            --code-bg: #0b0c13;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
        }
        /* Sidebar Stats */
        .sidebar {
            width: 300px;
            background-color: var(--surface);
            padding: 20px;
            border-right: 1px solid #2a2e42;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .stat-box {
            background-color: var(--code-bg);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        .stat-box h3 { margin: 0 0 5px 0; font-size: 14px; color: #8a92b2; }
        .stat-box p { margin: 0; font-size: 24px; font-weight: bold; color: var(--primary); }
        
        /* Main Search Area */
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .search-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
            position: relative;
        }
        input {
            width: 100%;
            padding: 20px 25px;
            font-size: 18px;
            background-color: var(--surface);
            border: 2px solid #2a2e42;
            color: white;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); }
        button {
            position: absolute;
            right: 10px;
            top: 10px;
            bottom: 10px;
            background-color: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 0 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* Results */
        #results { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .result-card {
            background-color: var(--surface);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #2a2e42;
        }
        .question { font-weight: bold; font-size: 18px; margin-bottom: 15px; color: #fff; }
        pre {
            background-color: var(--code-bg);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            color: #a6accd;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>⚙️ Graphite Engine</h2>
        <p style="color: #8a92b2; font-size: 14px; margin-top: -10px;">Hybrid Vamana PQ + SSD</p>
        
        <div class="stat-box">
            <h3>Latency</h3>
            <p id="stat-latency">-- ms</p>
        </div>
        <div class="stat-box">
            <h3>Graph Hops</h3>
            <p id="stat-hops">--</p>
        </div>
        <div class="stat-box">
            <h3>Disk Reads</h3>
            <p id="stat-disk">--</p>
        </div>
    </div>

    <div class="main">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Ask your codebase anything... (e.g. 'How to reverse a linked list in C++')" onkeypress="handleEnter(event)">
            <button onclick="performSearch()">Search</button>
        </div>
        <div id="results">
            </div>
    </div>

    <script>
        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '<p>Querying C++ Engine...</p>';

            try {
                // Send request to your FastAPI server
                const response = await fetch('http://127.0.0.1:8000/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, k: 5, L: 150 })
                });

                const data = await response.json();
                
                // Update the Geek Stats Sidebar
                document.getElementById('stat-latency').innerText = data.stats.latency_ms + ' ms';
                document.getElementById('stat-hops').innerText = data.stats.graph_hops;
                document.getElementById('stat-disk').innerText = data.stats.disk_reads; // <-- NEW: Injects exact disk reads

                // Render Results
                resultsContainer.innerHTML = '';
                data.results.forEach(result => {
                    // Split the text into Question and Answer (Splitting by " | A: ")
                    let parts = result.text.split("| A:");
                    let question = parts[0].replace("Q: ", "").trim();
                    let code = parts[1] ? parts[1].trim() : "No code found.";

                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.innerHTML = `
                        <div class="question">🔍 ${question}</div>
                        <pre><code>${code}</code></pre>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                resultsContainer.innerHTML = `<p style="color: red;">Error connecting to API. Is uvicorn running?</p>`;
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') performSearch();
        }
    </script>
</body>
</html>
